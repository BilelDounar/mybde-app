name: CI

# Intégration continue de l'application (React Native / Expo).
# Le déploiement de la version web se fait sur Firebase Hosting
# (hors de ce pipeline).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high || true

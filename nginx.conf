server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des assets texte
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les bundles Expo sont hashés : cache long sans risque.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Point de sortie du healthcheck Coolify (pas de dépendance réseau).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Routes expo-router : sert le HTML pré-rendu, sinon retombe sur l'app.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
